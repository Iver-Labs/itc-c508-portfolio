<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="PT-F2 Configuration-Level Retrieval Results: Precision@3, Recall@3, and MRR@3 across C1 to C12">
  <defs>
    <style>
      .bg { fill: #0e1013; }
      .panel { fill: #151920; stroke: #2a303c; stroke-width: 1; }
      .grid { stroke: #232934; stroke-width: 1; stroke-dasharray: 4 4; }
      .axis { stroke: #3b4352; stroke-width: 1.2; }
      .title { fill: #ffffff; font-family: 'Archivo', system-ui, sans-serif; font-size: 18px; font-weight: 700; }
      .subtitle { fill: #5ce1e6; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; }
      .label { fill: #c3c9d2; font-family: 'IBM Plex Sans', sans-serif; font-size: 11.5px; }
      .label-bold { fill: #ffffff; font-family: 'IBM Plex Sans', sans-serif; font-size: 11.5px; font-weight: 700; }
      .mono { fill: #a0a8b4; font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
      .mono-hi { fill: #5ce1e6; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; }
      .mono-warn { fill: #ffb4a8; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; }
      .p-bar { fill: #3b82f6; }
      .r-bar { fill: #f59e0b; }
      .m-bar { fill: #10b981; }
      .row-hi { fill: #13252c; stroke: #5ce1e6; stroke-width: 1; }
      .row-base { fill: #1c2029; }
    </style>
