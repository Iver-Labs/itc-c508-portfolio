<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="AlalayOFW Stage 2 Redesign and Live Website Evaluation Progression">
  <defs>
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11141a"/>
      <stop offset="100%" stop-color="#0b0d11"/>
    </linearGradient>
    <linearGradient id="cyanBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16a6ad"/>
      <stop offset="100%" stop-color="#5ce1e6"/>
    </linearGradient>
    <linearGradient id="amberBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b87a28"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="14" fill="url(#bgGrad1)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="46" fill="#5ce1e6" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600" letter-spacing="1.5">P-F1 · ALALAYOFW CAPSTONE · STAGE 2 REDESIGN TO LIVE CLOUD RUN DEPLOYMENT (33 TRILINGUAL VERSIONS)</text>
  <text x="40" y="78" fill="#ffffff" font-family="'Archivo', sans-serif" font-size="24" font-weight="800">How Data Cleaning, Hybrid RRF Retrieval &amp; Multilingual E5 Raised Correctness from 54.5% to 100%</text>
  <text x="40" y="102" fill="#a0a8b4" font-family="'IBM Plex Sans', sans-serif" font-size="14">Each stage isolates one architectural upgrade across 33 EN / TL / TGL test questions (27 answerable PEOS + DMW, 6 unanswerable)</text>

  <!-- Left Panel: Progression Bars -->
  <rect x="40" y="124" width="700" height="496" rx="10" fill="rgba(20,23,28,0.88)" stroke="rgba(255,255,255,0.12)"/>
  <text x="64" y="156" fill="#ffffff" font-family="'Archivo', sans-serif" font-size="16" font-weight="700">End-to-End Correctness &amp; Tagalog Recall Progression (R0 → Live Website)</text>
  <text x="64" y="176" fill="#a0a8b4" font-family="'IBM Plex Mono', monospace" font-size="12">Solid Cyan = Overall Correctness (33 Qs) · Amber = Tagalog Correctness (11 Qs)</text>

  <!-- Row 1: Best Baseline -->
  <g transform="translate(64, 200)">
    <text x="0" y="14" fill="#c3c9d2" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600">Baseline (8B, MiniLM)</text>
    <text x="0" y="32" fill="#a0a8b4" font-family="'IBM Plex Sans', sans-serif" font-size="11">800/100 · Vector only · 18 Qs</text>
    <rect x="200" y="0" width="380" height="16" rx="4" fill="rgba(255,255,255,0.06)"/>
    <rect x="200" y="0" width="211" height="16" rx="4" fill="rgba(160,168,180,0.55)"/>
    <text x="590" y="13" fill="#c3c9d2" font-family="'IBM Plex Mono', monospace" font-size="13">55.6%</text>
    <rect x="200" y="20" width="380" height="12" rx="3" fill="rgba(255,255,255,0.04)"/>
    <rect x="200" y="20" width="126" height="12" rx="3" fill="url(#amberBar)" opacity="0.75"/>
    <text x="590" y="30" fill="#f5a623" font-family="'IBM Plex Mono', monospace" font-size="11">33.3% TL</text>
  </g>

  <!-- Row 2: R0 -->
  <g transform="translate(64, 258)">
    <text x="0" y="14" fill="#c3c9d2" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600">R0 · 70B + Raw Baseline</text>
    <text x="0" y="32" fill="#a0a8b4" font-family="'IBM Plex Sans', sans-serif" font-size="11">2,080 chunks · 11/27 fallbacks</text>
    <rect x="200" y="0" width="380" height="16" rx="4" fill="rgba(255,255,255,0.06)"/>
    <rect x="200" y="0" width="207" height="16" rx="4" fill="rgba(160,168,180,0.65)"/>
    <text x="590" y="13" fill="#c3c9d2" font-family="'IBM Plex Mono', monospace" font-size="13">54.5%</text>
    <rect x="200" y="20" width="380" height="12" rx="3" fill="rgba(255,255,255,0.04)"/>
    <rect x="200" y="20" width="155" height="12" rx="3" fill="url(#amberBar)" opacity="0.8"/>
    <text x="590" y="30" fill="#f5a623" font-family="'IBM Plex Mono', monospace" font-size="11">40.9% TL</text>
  </g>

  <!-- Row 3: R1 -->
  <g transform="translate(64, 316)">
    <text x="0" y="14" fill="#ffffff" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600">R1 · Clean PEOS + 1-Rec DMW</text>
    <text x="0" y="32" fill="#a0a8b4" font-family="'IBM Plex Sans', sans-serif" font-size="11">3,849 chunks · +15.2% gain</text>
    <rect x="200" y="0" width="380" height="16" rx="4" fill="rgba(255,255,255,0.06)"/>
    <rect x="200" y="0" width="265" height="16" rx="4" fill="#16a6ad"/>
    <text x="590" y="13" fill="#ffffff" font-family="'IBM Plex Mono', monospace" font-size="13">69.7%</text>
    <rect x="200" y="20" width="380" height="12" rx="3" fill="rgba(255,255,255,0.04)"/>
    <rect x="200" y="20" width="242" height="12" rx="3" fill="url(#amberBar)"/>
    <text x="590" y="30" fill="#f5a623" font-family="'IBM Plex Mono', monospace" font-size="11">63.6% TL</text>
  </g>

  <!-- Row 4: R2 -->
  <g transform="translate(64, 374)">
    <text x="0" y="14" fill="#ffffff" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600">R2 · Hybrid (Vector + BM25)</text>
    <text x="0" y="32" fill="#a0a8b4" font-family="'IBM Plex Sans', sans-serif" font-size="11">RRF k=60 · DMW R@3 = 100%</text>
    <rect x="200" y="0" width="380" height="16" rx="4" fill="rgba(255,255,255,0.06)"/>
    <rect x="200" y="0" width="345" height="16" rx="4" fill="#16a6ad"/>
    <text x="590" y="13" fill="#ffffff" font-family="'IBM Plex Mono', monospace" font-size="13">90.9%</text>
    <rect x="200" y="20" width="380" height="12" rx="3" fill="rgba(255,255,255,0.04)"/>
    <rect x="200" y="20" width="276" height="12" rx="3" fill="url(#amberBar)"/>
    <text x="590" y="30" fill="#f5a623" font-family="'IBM Plex Mono', monospace" font-size="11">72.7% TL</text>
  </g>

  <!-- Row 5: R3a / R6 / FINAL -->
  <g transform="translate(64, 432)">
    <text x="0" y="14" fill="#5ce1e6" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700">R6 / FINAL · e5-small (800/200)</text>
    <text x="0" y="32" fill="#a0a8b4" font-family="'IBM Plex Sans', sans-serif" font-size="11">Notebook Final · 32/33 correct</text>
    <rect x="200" y="0" width="380" height="16" rx="4" fill="rgba(255,255,255,0.06)"/>
    <rect x="200" y="0" width="368.6" height="16" rx="4" fill="url(#cyanBar)"/>
    <text x="590" y="13" fill="#5ce1e6" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700">97.0%</text>
    <rect x="200" y="20" width="380" height="12" rx="3" fill="rgba(255,255,255,0.04)"/>
    <rect x="200" y="20" width="345" height="12" rx="3" fill="url(#amberBar)"/>
    <text x="590" y="30" fill="#f5a623" font-family="'IBM Plex Mono', monospace" font-size="11">90.9% TL</text>
  </g>

  <!-- Row 6: Live Website (Cloud Run) -->
  <g transform="translate(64, 494)">
    <rect x="-12" y="-10" width="668" height="58" rx="8" fill="rgba(92,225,230,0.08)" stroke="#5ce1e6" stroke-width="1"/>
    <text x="0" y="14" fill="#ffffff" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700">LIVE WEBSITE · Cloud Run</text>
    <text x="0" y="32" fill="#5ce1e6" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="600">ONNX CPU + RRF · 33/33 correct</text>
    <rect x="200" y="0" width="380" height="16" rx="4" fill="rgba(255,255,255,0.08)"/>
    <rect x="200" y="0" width="380" height="16" rx="4" fill="url(#cyanBar)"/>
    <text x="590" y="13" fill="#ffffff" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700">100.0%</text>
    <rect x="200" y="20" width="380" height="12" rx="3" fill="rgba(255,255,255,0.04)"/>
    <rect x="200" y="20" width="380" height="12" rx="3" fill="url(#amberBar)"/>
    <text x="590" y="30" fill="#ffffff" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700">100.0% TL</text>
  </g>

  <text x="64" y="586" fill="#a0a8b4" font-family="'IBM Plex Sans', sans-serif" font-size="12">Key insight: Replacing the 8B LLM with a 70B LLM alone (R0) left correctness flat (54.5%). Data cleaning (+15.2%),</text>
  <text x="64" y="604" fill="#a0a8b4" font-family="'IBM Plex Sans', sans-serif" font-size="12">hybrid BM25+vector retrieval (+21.2%), and multilingual-e5-small (+6.1%) drove virtually the entire accuracy gain.</text>

  <!-- Right Panel: Key Metric Cards -->
  <rect x="764" y="124" width="396" height="496" rx="10" fill="rgba(20,23,28,0.88)" stroke="rgba(255,255,255,0.12)"/>
  <text x="788" y="156" fill="#ffffff" font-family="'Archivo', sans-serif" font-size="16" font-weight="700">Production System Telemetry (Config R6)</text>
  <text x="788" y="176" fill="#a0a8b4" font-family="'IBM Plex Mono', monospace" font-size="12">Commit f649404 · asia-southeast1 (Singapore)</text>

  <!-- Card 1 -->
  <rect x="788" y="196" width="348" height="86" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(92,225,230,0.3)"/>
  <text x="806" y="220" fill="#5ce1e6" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600">LIVE WEBSITE EVALUATION (33 QUESTIONS)</text>
  <text x="806" y="252" fill="#ffffff" font-family="'Archivo', sans-serif" font-size="28" font-weight="800">33 / 33 (100%)</text>
  <text x="806" y="270" fill="#a0a8b4" font-family="'IBM Plex Sans', sans-serif" font-size="12">32/33 source-supported · 6/6 unanswerable handled</text>

  <!-- Card 2 -->
  <rect x="788" y="296" width="348" height="86" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
  <text x="806" y="320" fill="#c3c9d2" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600">HYBRID INDEX &amp; CHUNKING ARCHITECTURE</text>
  <text x="806" y="352" fill="#ffffff" font-family="'Archivo', sans-serif" font-size="26" font-weight="800">3,849 Chunks</text>
  <text x="806" y="370" fill="#a0a8b4" font-family="'IBM Plex Sans', sans-serif" font-size="12">57 PEOS (800/200) + 3,792 DMW records (1 per agency)</text>

  <!-- Card 3 -->
  <rect x="788" y="396" width="348" height="86" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
  <text x="806" y="420" fill="#c3c9d2" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600">AUTOMATED CONFIGURATION PARITY</text>
  <text x="806" y="452" fill="#5ce1e6" font-family="'Archivo', sans-serif" font-size="26" font-weight="800">7 / 7 Tests Passed</text>
  <text x="806" y="470" fill="#a0a8b4" font-family="'IBM Plex Sans', sans-serif" font-size="12">Prompt, RRF k=60, BM25 k1/b, e5-small 384-d, index</text>

  <!-- Card 4 -->
  <rect x="788" y="496" width="348" height="98" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
  <text x="806" y="520" fill="#c3c9d2" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600">BROWSER END-TO-END LATENCY</text>
  <text x="806" y="552" fill="#ffffff" font-family="'Archivo', sans-serif" font-size="26" font-weight="800">2.44 s Mean</text>
  <text x="806" y="572" fill="#a0a8b4" font-family="'IBM Plex Sans', sans-serif" font-size="12">Range 1.55–3.62 s (includes ONNX embed + RRF +</text>
  <text x="806" y="586" fill="#a0a8b4" font-family="'IBM Plex Sans', sans-serif" font-size="12">SEA-LION v3-70B-IT API round trip on Cloud Run)</text>
</svg>
