  <text x="228" y="365" text-anchor="end" class="label">G (2000/500 · 700/70 · k3)</text>
  <rect x="240" y="350" width="183.2" height="6" class="mrr-bar"/>
  <rect x="240" y="357" width="225.0" height="6" class="cor-bar"/>
