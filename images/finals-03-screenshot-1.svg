  <!-- N*: 800/100 | 800/100 | k=5 | Strict | MRR .463 | Corr .417 | Sup .722 -->
  <text x="228" y="589" text-anchor="end" class="label">N* (800/100 · k5 · Strict)</text>
  <rect x="240" y="574" width="208.4" height="6" class="mrr-bar"/>
  <rect x="240" y="581" width="187.7" height="6" class="cor-bar"/>
  <rect x="240" y="588" width="324.9" height="6" class="sup-bar"/>
  <text x="710" y="589" class="mono">0.463 · 0.417 · 72.2%</text>
