  <rect x="34" y="251" width="1132" height="29" rx="5" class="row-warn"/>
  <text x="228" y="269" text-anchor="end" class="label-b" fill="#ffb4a8">✗ D (800/200 · 25% overlap)</text>
  <rect x="240" y="254" width="25.2" height="6" class="mrr-bar"/>
  <rect x="240" y="261" width="12.6" height="6" class="cor-bar"/>
