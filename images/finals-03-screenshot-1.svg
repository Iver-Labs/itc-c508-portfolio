  <!-- K: 600/75 | 800/100 | k=3 | MRR .435 | Corr .500 | Sup .722 -->
  <text x="228" y="493" text-anchor="end" class="label">K (600/75 · 800/100 · k3)</text>
  <rect x="240" y="478" width="195.8" height="6" class="mrr-bar"/>
  <rect x="240" y="485" width="225.0" height="6" class="cor-bar"/>
  <rect x="240" y="492" width="324.9" height="6" class="sup-bar"/>
  <text x="710" y="493" class="mono">0.435 · 0.500 · 72.2%</text>
  <text x="885" y="493" class="mono">2,098 · 12.20s</text>
  <text x="1030" y="493" class="mono">Best P@3 (0.241) pre-prompt</text>

  <!-- L*: 800/100 | 800/100 | k=3 | Strict | MRR .537 | Corr .500 | Sup .778 -->
  <rect x="34" y="507" width="1132" height="29" rx="5" class="row-hi"/>
  <text x="228" y="525" text-anchor="end" class="label-b" fill="#5ce1e6">★ L* (800/100 · k3 · Strict)</text>
  <rect x="240" y="510" width="241.7" height="6" class="mrr-bar"/>
  <rect x="240" y="517" width="225.0" height="6" class="cor-bar"/>
  <rect x="240" y="524" width="350.1" height="6" class="sup-bar"/>
  <text x="710" y="525" class="mono-hi">0.537 · 0.500 · 77.8%</text>
  <text x="885" y="525" class="mono-hi">2,079 · 4.91s (-56%)</text>
  <text x="1030" y="525" class="mono-hi">0 unsupported DMW claims</text>

  <!-- M*: 600/75 | 800/100 | k=3 | Strict | MRR .481 | Corr .556 | Sup .722 -->
  <text x="228" y="557" text-anchor="end" class="label-b">M* (600/75 · 800/100 · Strict)</text>
  <rect x="240" y="542" width="216.5" height="6" class="mrr-bar"/>
  <rect x="240" y="549" width="250.2" height="6" class="cor-bar"/>
  <rect x="240" y="556" width="324.9" height="6" class="sup-bar"/>
  <text x="710" y="557" class="mono">0.481 · 0.556 · 72.2%</text>
  <text x="885" y="557" class="mono-hi">2,098 · 4.76s</text>
