  <text x="885" y="269" class="mono-warn">2,387 · 11.34s</text>
  <text x="1030" y="269" class="mono-warn">+308 dupes broke top-3</text>

  <!-- E: 800/100 | 800/100 | k=5 | MRR .537 | Corr .528 | Sup .667 -->
  <text x="228" y="301" text-anchor="end" class="label">E (800/100 · 800/100 · k5)</text>
  <rect x="240" y="286" width="241.7" height="6" class="mrr-bar"/>
  <rect x="240" y="293" width="237.6" height="6" class="cor-bar"/>
