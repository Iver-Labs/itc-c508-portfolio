  <!-- F: 1500/300 | 700/70 | k=3 | MRR .250 | Corr .278 | Sup .778 -->
  <text x="228" y="333" text-anchor="end" class="label">F (1500/300 · 700/70 · k3)</text>
  <rect x="240" y="318" width="112.5" height="6" class="mrr-bar"/>
  <rect x="240" y="325" width="125.1" height="6" class="cor-bar"/>
  <rect x="240" y="332" width="350.1" height="6" class="sup-bar"/>
  <text x="710" y="333" class="mono">0.250 · 0.278 · 77.8%</text>
