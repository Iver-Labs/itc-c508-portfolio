  <text x="228" y="205" text-anchor="end" class="label">B2 (800/100 repeat · k3)</text>
  <rect x="240" y="190" width="241.7" height="6" class="mrr-bar"/>
  <rect x="240" y="197" width="237.6" height="6" class="cor-bar"/>
