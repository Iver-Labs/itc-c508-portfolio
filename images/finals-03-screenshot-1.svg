  <!-- B: 800/100 | 800/100 | k=3 | MRR .537 (241.7) | Corr .556 (250.2) | Sup .833 (374.9) -->
  <rect x="34" y="155" width="1132" height="29" rx="5" class="row-hi"/>
  <text x="228" y="173" text-anchor="end" class="label-b" fill="#5ce1e6">★ B (800/100 · 800/100 · k3)</text>
  <rect x="240" y="158" width="241.7" height="6" class="mrr-bar"/>
  <rect x="240" y="165" width="250.2" height="6" class="cor-bar"/>
  <rect x="240" y="172" width="374.9" height="6" class="sup-bar"/>
  <text x="710" y="173" class="mono-hi">0.537 · 0.556 · 83.3%</text>
  <text x="885" y="173" class="mono-hi">2,079 · 11.24s</text>
  <text x="1030" y="173" class="mono-hi">Best overall balance</text>

