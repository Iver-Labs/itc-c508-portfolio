<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="WW-F1 Part A 15-Configuration RAG Parameter Matrix: MRR@k, Answer Correctness, and Supported Share">
  <defs>
    <style>
      .bg { fill: #0e1013; }
      .panel { fill: #151920; stroke: #2a303c; stroke-width: 1; }
      .grid { stroke: #232934; stroke-width: 1; stroke-dasharray: 4 4; }
      .axis { stroke: #3b4352; stroke-width: 1.2; }
      .title { fill: #ffffff; font-family: 'Archivo', system-ui, sans-serif; font-size: 18px; font-weight: 700; }
      .subtitle { fill: #5ce1e6; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; }
      .label { fill: #c3c9d2; font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; }
      .label-b { fill: #ffffff; font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 700; }
      .mono { fill: #a0a8b4; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; }
      .mono-hi { fill: #5ce1e6; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 600; }
      .mono-warn { fill: #ffb4a8; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 600; }
      .mrr-bar { fill: #3b82f6; }
      .cor-bar { fill: #5ce1e6; }
      .sup-bar { fill: #10b981; }
      .row-hi { fill: #13252c; stroke: #5ce1e6; stroke-width: 1; }
      .row-warn { fill: #25181b; stroke: #ffb4a8; stroke-width: 0.8; }
    </style>
  </defs>

  <rect width="1200" height="680" class="bg"/>

  <text x="28" y="32" class="subtitle">WW-F1 PART A · 15 RAG CONFIGURATIONS (A–N*) ON TESLA T4 GPU · 18 TRILINGUAL QUERIES (PEOS + DMW)</text>
  <text x="28" y="56" class="title">Chunk Size, Overlap, Top-k &amp; Prompt Strictness vs. MRR@k, Correctness, and Source Support</text>

  <rect x="24" y="72" width="1152" height="584" rx="10" class="panel"/>

  <!-- Legend -->
  <rect x="240" y="90" width="14" height="10" rx="2" class="mrr-bar"/>
  <text x="260" y="99" class="label">MRR@k (max 0.537)</text>
  <rect x="415" y="90" width="14" height="10" rx="2" class="cor-bar"/>
  <text x="435" y="99" class="label">Answer Correctness (max 0.556)</text>
  <rect x="650" y="90" width="14" height="10" rx="2" class="sup-bar"/>
  <text x="670" y="99" class="label">Supported by Sources % (max 83.3%)</text>
  <text x="920" y="99" class="mono-hi">* Stricter System Prompt (L, M, N)</text>

  <!-- X-axis grid: x=240 is 0.0, x=690 is 1.0 (450px per 1.0) -->
  <line x1="240" y1="115" x2="240" y2="615" class="axis"/>
  <line x1="330" y1="115" x2="330" y2="615" class="grid"/>
  <line x1="420" y1="115" x2="420" y2="615" class="grid"/>
  <line x1="510" y1="115" x2="510" y2="615" class="grid"/>
  <line x1="600" y1="115" x2="600" y2="615" class="grid"/>
  <line x1="690" y1="115" x2="690" y2="615" class="grid"/>

  <text x="240" y="633" text-anchor="middle" class="mono">0.00</text>
  <text x="330" y="633" text-anchor="middle" class="mono">0.20</text>
  <text x="420" y="633" text-anchor="middle" class="mono">0.40</text>
  <text x="510" y="633" text-anchor="middle" class="mono">0.60</text>
  <text x="600" y="633" text-anchor="middle" class="mono">0.80</text>
  <text x="690" y="633" text-anchor="middle" class="mono">1.00</text>

  <text x="710" y="116" class="subtitle">MRR · CORR · SUPP</text>
  <text x="885" y="116" class="subtitle">CHUNKS · GEN (s)</text>
  <text x="1030" y="116" class="subtitle">KEY FINDING</text>

  <!-- 15 runs, y starts at 124, step 32.5 -->
  <!-- A: 400/50 | 400/50 | k=3 | MRR .306 (137.7) | Corr .306 (137.7) | Sup .667 (300.2) -->
  <text x="228" y="141" text-anchor="end" class="label">A (400/50 · 400/50 · k3)</text>
  <rect x="240" y="126" width="137.7" height="6" class="mrr-bar"/>
  <rect x="240" y="133" width="137.7" height="6" class="cor-bar"/>
  <rect x="240" y="140" width="300.2" height="6" class="sup-bar"/>
  <text x="710" y="141" class="mono">0.306 · 0.306 · 66.7%</text>
  <text x="885" y="141" class="mono">3,961 · 11.65s</text>
