  <text x="885" y="365" class="mono">2,196 · 11.58s</text>
  <text x="1030" y="365" class="mono">Boundary luck; lost P2</text>

  <!-- H: 800/100 | 700/70 | k=3 | MRR .463 | Corr .528 | Sup .778 -->
  <text x="228" y="397" text-anchor="end" class="label">H (800/100 · 700/70 · k3)</text>
  <rect x="240" y="382" width="208.4" height="6" class="mrr-bar"/>
  <rect x="240" y="389" width="237.6" height="6" class="cor-bar"/>
  <rect x="240" y="396" width="350.1" height="6" class="sup-bar"/>
  <text x="710" y="397" class="mono">0.463 · 0.528 · 77.8%</text>
  <text x="885" y="397" class="mono">2,235 · 11.24s</text>
  <text x="1030" y="397" class="mono">DMW shift hurt P2-TGL</text>

  <!-- I: 800/100 | 500/50 | k=3 | MRR .472 | Corr .500 | Sup .611 -->
  <text x="228" y="429" text-anchor="end" class="label">I (800/100 · 500/50 · k3)</text>
  <rect x="240" y="414" width="212.4" height="6" class="mrr-bar"/>
  <rect x="240" y="421" width="225.0" height="6" class="cor-bar"/>
  <rect x="240" y="428" width="275.0" height="6" class="sup-bar"/>
  <text x="710" y="429" class="mono">0.472 · 0.500 · 61.1%</text>
  <text x="885" y="429" class="mono">3,082 · 12.40s</text>
  <text x="1030" y="429" class="mono-warn">Found MOJO; split D2</text>

  <!-- J: 1000/120 | 800/100 | k=3 | MRR .370 | Corr .417 | Sup .722 -->
  <text x="228" y="461" text-anchor="end" class="label">J (1000/120 · 800/100 · k3)</text>
  <rect x="240" y="446" width="166.5" height="6" class="mrr-bar"/>
  <rect x="240" y="453" width="187.7" height="6" class="cor-bar"/>
  <rect x="240" y="460" width="324.9" height="6" class="sup-bar"/>
  <text x="710" y="461" class="mono">0.370 · 0.417 · 72.2%</text>
  <text x="885" y="461" class="mono">2,067 · 11.91s</text>
