  <!-- 5 Retrieval Shifts Table -->
  <text x="633" y="332" fill="#ffffff" font-family="'Archivo', sans-serif" font-size="15" font-weight="700">Analysis of the 5 Top-3 Retrieval Shifts (ONNX CPU vs. Python GPU)</text>
  <g transform="translate(633, 348)" font-family="'IBM Plex Mono', monospace" font-size="11.5">
    <rect x="0" y="0" width="503" height="32" rx="4" fill="rgba(255,255,255,0.06)"/>
