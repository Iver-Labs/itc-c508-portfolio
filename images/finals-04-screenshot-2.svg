    <text x="14" y="373" fill="#a0a8b4" font-size="11">Exact numerical agreement with Python rank_bm25 0.2.2 library</text>
    <text x="438" y="364" fill="#5ce1e6" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700">PASS</text>
