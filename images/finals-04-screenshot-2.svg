    <text x="80" y="112" fill="#c3c9d2">PEOS p.4 moved from rank 2 to rank 1</text>
    <text x="360" y="112" fill="#ffffff">Higher rank · Same</text>

    <text x="12" y="142" fill="#c3c9d2">D1-TGL</text>
    <text x="80" y="142" fill="#a0a8b4">Unrelated rank-2 DMW record swapped</text>
    <text x="360" y="142" fill="#a0a8b4">No effect · Correct</text>

    <text x="12" y="172" fill="#c3c9d2">D4-TL</text>
    <text x="80" y="172" fill="#a0a8b4">Unrelated rank-3 DMW record swapped</text>
    <text x="360" y="172" fill="#a0a8b4">No effect · Correct</text>
