  <text x="633" y="564" fill="#a0a8b4" font-family="'IBM Plex Sans', sans-serif" font-size="12">Why 5 top-3 lists shifted: Small floating-point differences between the notebook's Python</text>
  <text x="633" y="582" fill="#a0a8b4" font-family="'IBM Plex Sans', sans-serif" font-size="12">embedding runtime and the website's ONNX CPU runtime shifted near-tied cosine scores;</text>
